<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projeto Rural | +300 Plantas Prontas em PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0f0a;
    --bg-card: #121a12;
    --bg-card-2: #1a2418;
    --border: rgba(255,255,255,.08);
    --text: #f4f5f1;
    --text-muted: #9aa89a;
    --accent: #f2751e;
    --accent-dark: #d9640f;
    --green: #4ade80;
    --card-shadow: 0 4px 20px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse 1200px 600px at 50% -10%, rgba(34,197,94,.14), transparent 60%),
      radial-gradient(ellipse 900px 500px at 100% 0%, rgba(242,117,30,.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.price,.headline{font-family:'Space Grotesk',sans-serif;}
  .container{max-width:600px; margin:0 auto; padding:0 20px;}
  img{max-width:100%; display:block; border-radius:12px;}
  a{color:inherit; text-decoration:none;}

  /* EYEBROW / PILL LABEL */
  .eyebrow{
    display:inline-block;
    border:1px solid var(--border);
    background:var(--bg-card-2);
    color:var(--text-muted);
    font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    padding:6px 14px; border-radius:999px; margin-bottom:12px;
  }

  /* STICKY TICKER BAR */
  .sticky-bar{
    position:sticky; top:0; z-index:50;
    background:linear-gradient(90deg, #1a2418, #10190f);
    border-bottom:1px solid var(--border);
    color:#ffffff;
    overflow:hidden;
  }
  .ticker-track{
    display:inline-flex; width:max-content;
    animation: ticker-scroll 26s linear infinite;
  }
  .sticky-bar:hover .ticker-track{animation-play-state:paused;}
  .ticker-item{
    display:inline-flex; align-items:center;
    white-space:nowrap;
    padding:11px 26px;
    font-weight:700; font-size:13px;
  }
  .ticker-item .timer-el{color:var(--accent); font-family:'Space Grotesk',sans-serif;}
  @keyframes ticker-scroll{
    0%{transform:translateX(0);}
    100%{transform:translateX(-50%);}
  }

  /* HERO */
  .hero{padding:32px 0 24px; position:relative;}
  .hero-media{margin-top:20px;}
  .badge{
    display:inline-block;
    background:var(--bg-card-2);
    border:1px solid var(--border);
    color:var(--accent);
    font-size:12px;
    font-weight:700;
    padding:6px 12px;
    border-radius:999px;
    margin-bottom:16px;
  }
  .brand{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:13px; letter-spacing:.5px;
    color:var(--text-muted); margin:18px 0 20px; opacity:.85;
  }
  .brand span{color:var(--text-muted); font-weight:600;}
  .brand .brand-accent{color:var(--accent);}
  .headline{font-size:36px; font-weight:800; line-height:1.1; margin-bottom:16px; letter-spacing:-.5px;}
  .headline b{color:var(--accent); display:block; margin-bottom:2px;}
  .subheadline{color:var(--text-muted); font-size:17px; margin-bottom:8px;}
  .hero-img{margin-bottom:20px; border:1px solid var(--border);}

  .feature-badges{display:flex; flex-wrap:wrap; gap:10px; margin-top:20px;}
  .feature-badges .fb{
    display:flex; align-items:center; gap:8px;
    background:var(--bg-card); border:1px solid var(--border);
    border-radius:10px; padding:10px 14px; font-size:13px; font-weight:600;
    box-shadow:var(--card-shadow);
  }
  .feature-badges .fb .fb-icon{font-size:16px;}

  .scroll-hint{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    margin-top:28px; color:var(--text-muted); font-size:12px; font-weight:600;
    opacity:.7;
  }
  .scroll-hint .chevron{
    font-size:18px; color:var(--accent);
    animation: bounce 1.6s ease-in-out infinite;
  }
  @keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(6px);}
  }

  .cta-btn{
    display:block;
    width:100%;
    background:var(--accent);
    color:#ffffff;
    font-weight:700;
    font-size:17px;
    text-align:center;
    padding:16px 20px;
    border-radius:12px;
    border:none;
    cursor:pointer;
    box-shadow:0 8px 24px rgba(242,117,30,.25);
    transition:transform .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .cta-btn:hover{background:var(--accent-dark); transform:translateY(-2px); box-shadow:0 10px 28px rgba(242,117,30,.35);}
  .sub-cta{text-align:center; color:var(--text-muted); font-size:13px; margin-top:10px;}

  .stats{
    display:flex; align-items:center; gap:10px;
    background:var(--bg-card); border:1px solid var(--border);
    border-radius:12px; padding:14px 16px; margin-top:20px;
    box-shadow:var(--card-shadow);
  }
  .stats .num{font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--accent); font-size:20px;}

  /* SECTION GENERIC */
  section{padding:32px 0;}
  section h2{font-size:24px; margin-bottom:8px;}
  section .section-sub{color:var(--text-muted); margin-bottom:20px; font-size:15px;}
  .divider{height:1px; background:var(--border); margin:0;}

  /* GALERIAS AUTO-SCROLL (provas sociais / acervo) */
  .hscroll-gallery{
    display:flex; gap:12px; overflow-x:auto; margin:20px -20px 0; padding:4px 20px 8px;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .hscroll-gallery::-webkit-scrollbar{display:none;}
  .hscroll-gallery img{
    border-radius:14px; box-shadow:var(--card-shadow); flex-shrink:0;
  }
  .hscroll-gallery.social-proof img{ flex:0 0 200px; height:290px; object-fit:cover; object-position:top; }
  .hscroll-gallery.acervo img{ flex:0 0 300px; height:210px; object-fit:cover; }

  /* DOR */
  .pain-list{list-style:none; margin-bottom:16px;}
  .pain-list li{
    display:flex; gap:10px; align-items:flex-start;
    background:var(--bg-card); border:1px solid var(--border);
    border-radius:10px; padding:14px; margin-bottom:10px; font-size:15px;
    box-shadow:var(--card-shadow);
  }
  .pain-list li .x{color:#f87171; font-weight:700;}
  .pain-close{font-weight:600; color:var(--text); font-size:16px; margin-top:14px;}

  /* COMPARATIVO JEITO COMUM x JEITO INTELIGENTE */
  .compare-grid{display:flex; flex-direction:column; gap:14px; margin-bottom:16px;}
  .compare-col{
    border-radius:12px; padding:16px; box-shadow:var(--card-shadow); border:1px solid var(--border);
  }
  .compare-col h3{font-size:15px; margin-bottom:10px;}
  .compare-col ul{list-style:none;}
  .compare-col li{font-size:14px; padding:6px 0; line-height:1.4; color:var(--text-muted);}
  .compare-bad{background:rgba(239,68,68,.08); border-color:rgba(239,68,68,.3);}
  .compare-bad h3{color:#f87171;}
  .compare-good{background:rgba(74,222,128,.08); border-color:rgba(74,222,128,.3);}
  .compare-good h3{color:var(--green);}

  /* O QUE VOCE RECEBE */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .grid-card{
    background:var(--bg-card); border:1px solid var(--border);
    border-radius:12px; padding:16px; transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:var(--card-shadow);
  }
  .grid-card:hover{transform:translateY(-3px); border-color:var(--accent);}
  .grid-card .icon{font-size:24px; margin-bottom:8px;}
  .grid-card h3{font-size:15px; margin-bottom:4px;}
  .grid-card p{font-size:13px; color:var(--text-muted);}
  .grid-card.has-photo{padding:0; overflow:hidden;}
  .grid-card.has-photo .photo{
    width:100%; height:170px; object-fit:cover; border-radius:0;
    display:block; margin-bottom:0;
  }
  .grid-card.has-photo .card-body{padding:14px 16px 16px;}
  .plant-collage{
    display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr;
    gap:2px; height:170px;
  }
  .plant-collage img{width:100%; height:100%; object-fit:cover; border-radius:0; display:block;}
  .grid-card.has-photo .icon{
    position:relative; top:-16px; margin-bottom:-10px;
    background:var(--bg-card); border:1px solid var(--border);
    width:32px; height:32px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
  }

  /* VITRINE DE PROJETOS (fotos grandes) */
  .showcase-grid{display:grid; grid-template-columns:1fr; gap:10px; margin-top:20px;}
  .showcase-grid img{
    width:100%; height:230px; object-fit:cover; border-radius:14px;
    box-shadow:var(--card-shadow); border:1px solid var(--border);
  }

  /* PROVA SOCIAL */
  .testimonial{
    background:var(--bg-card); border:1px solid var(--border);
    border-radius:12px; padding:16px; margin-bottom:12px;
    box-shadow:var(--card-shadow);
  }
  .testimonial .stars{color:var(--accent); margin-bottom:8px; font-size:14px;}
  .testimonial p{font-size:14px; margin-bottom:10px;}
  .testimonial .author-row{display:flex; align-items:center; gap:10px; padding-top:10px; border-top:1px solid var(--border);}
  .testimonial .avatar{
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px;
    color:#ffffff; flex-shrink:0;
  }
  .testimonial .avatar.avatar-img{padding:0; overflow:hidden; background:none;}
  .testimonial .avatar.avatar-img img{
    width:100%; height:100%; object-fit:cover; border-radius:50%; display:block;
  }
  .testimonial .author-info{line-height:1.3;}
  .testimonial .author-name{font-size:13px; color:var(--green); font-weight:700;}
  .testimonial .author{font-size:12px; color:var(--text-muted); font-weight:500;}

  /* BONUS */
  .bonus-card{
    background:linear-gradient(135deg, var(--bg-card), var(--bg-card-2));
    border:1px solid var(--accent); border-radius:12px;
    padding:16px; margin-bottom:12px; position:relative;
    box-shadow:var(--card-shadow);
  }
  .bonus-tag{
    display:inline-block; background:var(--accent); color:#ffffff;
    font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; margin-bottom:8px;
  }
  .bonus-card h3{font-size:16px; margin-bottom:4px;}
  .bonus-card p{font-size:13px; color:var(--text-muted); margin-bottom:8px;}
  .bonus-card .old-price{text-decoration:line-through; color:var(--text-muted); font-size:13px;}

  /* BARRA DE EQUACAO DOS BONUS */
  .equation-bar{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    text-align:center; margin-top:20px;
    padding:20px; background:var(--bg-card-2); border:1px solid var(--border); border-radius:14px;
  }
  .equation-bar .eq-item{display:flex; flex-direction:column; gap:2px;}
  .equation-bar .eq-label{font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em;}
  .equation-bar .eq-value{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px;}
  .equation-bar .eq-op{color:var(--text-muted); font-size:18px; font-weight:700;}
  .equation-bar .eq-final .eq-value{color:var(--green); font-size:26px;}

  /* PRICING */
  .plans{display:flex; flex-direction:column; gap:16px;}
  .plan{
    background:var(--bg-card); border:1px solid var(--border);
    border-radius:16px; padding:20px; position:relative;
    box-shadow:var(--card-shadow);
  }
  .plan.featured{border:2px solid var(--accent); background:var(--bg-card-2);}
  .plan-badge{
    position:absolute; top:-12px; left:50%; transform:translateX(-50%);
    background:var(--accent); color:#ffffff; font-size:12px; font-weight:700;
    padding:4px 14px; border-radius:999px; white-space:nowrap;
  }
  .plan h3{font-size:17px; margin-bottom:6px;}
  .plan .anchor{color:var(--text-muted); text-decoration:line-through; font-size:14px;}
  .price{font-size:34px; font-weight:700; color:var(--accent); margin:4px 0 4px;}
  .price small{font-size:15px; color:var(--text-muted); font-weight:500;}
  .savings{display:block; color:var(--green); font-weight:700; font-size:13px; margin-bottom:12px;}
  .plan ul{list-style:none; margin-bottom:16px;}
  .plan ul li{font-size:14px; padding:5px 0; color:var(--text-muted);}
  .plan ul li b{color:var(--text); font-weight:600;}
  .trust-badges{
    display:flex; justify-content:center; gap:14px; margin-top:24px;
    color:var(--text-muted); font-size:12px; flex-wrap:wrap;
  }

  /* GARANTIA */
  .guarantee{
    background:var(--bg-card); border:1px solid var(--green);
    border-radius:16px; padding:24px; text-align:center;
    box-shadow:var(--card-shadow);
  }
  .guarantee .seal{font-size:48px; margin-bottom:12px;}
  .guarantee h2{color:var(--green); font-size:20px; margin-bottom:10px;}
  .guarantee p{font-size:14px; color:var(--text-muted);}

  /* FAQ */
  .faq-item{border-bottom:1px solid var(--border); padding:14px 0;}
  .faq-q{
    display:flex; justify-content:space-between; align-items:center;
    cursor:pointer; font-weight:600; font-size:15px;
  }
  .faq-q .arrow{transition:transform .2s ease; color:var(--accent);}
  .faq-item.open .faq-q .arrow{transform:rotate(45deg);}
  .faq-a{
    max-height:0; overflow:hidden; transition:max-height .25s ease;
    font-size:14px; color:var(--text-muted); padding-top:0;
  }
  .faq-item.open .faq-a{max-height:200px; padding-top:10px;}

  /* CTA FINAL */
  .final-cta{
    background:linear-gradient(135deg, var(--bg-card-2), var(--bg-card));
    border:1px solid var(--accent); border-radius:16px;
    padding:24px; text-align:center;
  }
  .final-cta h2{font-size:22px; margin-bottom:10px;}
  .final-cta p{color:var(--text-muted); font-size:14px; margin-bottom:18px;}

  footer{padding:24px 0 40px; text-align:center; color:var(--text-muted); font-size:12px;}
  footer a{text-decoration:underline;}

  /* POPUP DOWNSELL */
  .overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.75);
    z-index:100; align-items:center; justify-content:center; padding:20px;
  }
  .overlay.active{display:flex;}
  .popup{
    background:var(--bg-card); border:1px solid var(--accent);
    border-radius:16px; padding:24px; max-width:400px; width:100%; text-align:center;
  }
  .popup h3{font-size:19px; margin-bottom:10px;}
  .popup p{font-size:14px; color:var(--text-muted); margin-bottom:16px;}
  .popup .close-popup{
    display:block; margin-top:10px; color:var(--text-muted); font-size:13px; cursor:pointer;
  }

  @media(max-width:380px){
    .grid{grid-template-columns:1fr 1fr;}
    .headline{font-size:30px;}
  }

  /* DESKTOP */
  @media(min-width:860px){
    .container{max-width:900px;}

    .hero{padding:56px 0 64px;}
    .hero-media{margin-top:32px; text-align:center;}
    .hero-media .hero-img{display:inline-block; max-width:520px;}
    .headline{font-size:52px;}
    .subheadline{font-size:19px;}
    .feature-badges{justify-content:center;}

    .hscroll-gallery{margin:24px 0 0;}
    .hscroll-gallery.social-proof img{flex:0 0 240px; height:340px;}
    .hscroll-gallery.acervo img{flex:0 0 380px; height:266px;}

    section{padding:48px 0;}
    section h2{font-size:28px;}

    .pain-list{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
    .pain-list li{margin-bottom:0;}

    .compare-grid{flex-direction:row;}
    .compare-col{flex:1;}

    .grid{grid-template-columns:repeat(3, 1fr);}
    .grid-card.has-photo .photo{height:190px;}
    .plant-collage{height:190px;}

    .showcase-grid{grid-template-columns:repeat(3, 1fr);}
    .showcase-grid img{height:280px;}

    .bonus-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
    .bonus-card{margin-bottom:0;}
    .equation-bar{flex-direction:row; justify-content:center; gap:24px; padding:24px 32px;}

    .testimonials-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:16px;}
    .testimonial{margin-bottom:0;}

    .plans{flex-direction:row; align-items:stretch;}
    .plan{flex:1;}

    .guarantee, .final-cta{padding:36px 48px;}
  }
</style>
</head>

    function item(i, hidden){
      const timer = i.hasTimer ? ' <b class="timer-el">00:00</b>' : '';
      return `<span class="ticker-item"${hidden ? ' aria-hidden="true"' : ''}>${i.text}${timer}</span>`;
    }
    return ticker.items.map(i => item(i, false)).join('') + ticker.items.map(i => item(i, true)).join('');
  }

  function heroHtml(h){
    return `
      <div class="hero-text">
        <span class="badge">${h.badge}</span>
        <h1 class="headline">${h.headlineHtml}</h1>
        <p class="subheadline">${h.subheadline}</p>
        <div class="brand">${h.brandHtml}</div>
        <a href="${h.ctaHref}" class="cta-btn">${h.ctaText}</a>
        <p class="sub-cta">${h.subCta}</p>
        <div class="feature-badges">
          ${h.featureBadges.map(fb => `<span class="fb"><span class="fb-icon">${fb.icon}</span> ${fb.text}</span>`).join('')}
        </div>
      </div>
      <div class="hero-media">
        <img class="hero-img" src="${h.heroImg}" alt="${h.heroImgAlt}">
        <div class="scroll-hint">
          <span>Role para baixo</span>
          <span class="chevron">⌄</span>
        </div>
      </div>
    `;
  }

  function showcaseHtml(s){
    return `
      <span class="eyebrow">${s.eyebrow}</span>
      <h2 style="text-align:center;">${s.heading}</h2>
      <p class="section-sub" style="text-align:center;">${s.sub}</p>
      <div class="showcase-grid">
        ${s.images.map(img => `<img src="${img.src}" alt="${img.alt}">`).join('')}
      </div>
      <a href="${s.ctaHref}" class="cta-btn" style="margin-top:20px;">${s.ctaText}</a>
    `;
  }

  function painHtml(p){
    return `
      <h2>${p.heading}</h2>
      <p class="section-sub">${p.sub}</p>
      <div class="compare-grid">
        <div class="compare-col compare-bad">
          <h3>${p.bad.title}</h3>
          <ul>${p.bad.items.map(i => `<li>${i}</li>`).join('')}</ul>
        </div>
        <div class="compare-col compare-good">
          <h3>${p.good.title}</h3>
          <ul>${p.good.items.map(i => `<li>${i}</li>`).join('')}</ul>
        </div>
      </div>
      <p class="pain-close">${p.closing}</p>
    `;
  }

  function whatYouGetHtml(w){
    function card(c){
      if (c.photo) {
        return `
          <div class="grid-card has-photo">
            <img class="photo" src="${c.photo}" alt="${c.photoAlt || ''}">
            <div class="card-body">
              <div class="icon">${c.icon}</div>
              <h3>${c.title}</h3>
              <p>${c.desc}</p>
            </div>
          </div>`;
      }
      return `
        <div class="grid-card">
          <div class="icon">${c.icon}</div>
          <h3>${c.title}</h3>
          <p>${c.desc}</p>
        </div>`;
    }
    return `
      <span class="eyebrow">${w.eyebrow}</span>
      <h2>${w.headingHtml}</h2>
      <p class="section-sub">${w.sub}</p>
      <div class="grid">${w.cards.map(card).join('')}</div>
    `;
  }

  function acervoRuralHtml(a){
    function card(c){
      return `
        <div class="grid-card">
          <div class="icon">${c.icon}</div>
          <h3>${c.title}</h3>
          <p>${c.desc}</p>
        </div>`;
    }
    return `
      <span class="eyebrow">${a.eyebrow}</span>
      <h2>${a.headingHtml}</h2>
      <p class="section-sub">${a.sub}</p>
      <span class="badge">${a.countBadge}</span>
      <div class="grid" style="margin-top:16px;">${a.cards.map(card).join('')}</div>
      <h3 style="margin-top:28px; font-size:17px;">${a.galleryHeading}</h3>
      <div class="hscroll-gallery acervo auto-scroll">
        ${a.gallery.map(img => `<img src="${img.src}" alt="${img.alt}">`).join('')}
      </div>
      <a href="${a.ctaHref}" class="cta-btn" style="margin-top:20px;">${a.ctaText}</a>
    `;
  }

  function ruralPacksHtml(rp){
    function item(i){
      return `
        <div class="bonus-card">
          <span class="bonus-tag">${i.icon} ${i.tag}</span>
          <h3>${i.title}</h3>
          <p>${i.desc}</p>
        </div>`;
    }
    return `
      <span class="eyebrow">${rp.eyebrow}</span>
      <h2>${rp.heading}</h2>
      <p class="section-sub">${rp.sub}</p>
      <div class="bonus-grid">${rp.items.map(item).join('')}</div>
    `;
  }

  function testimonialsHtml(t){
    function item(i){
      const avatar = i.avatarImg
        ? `<div class="avatar avatar-img"><img src="${i.avatarImg}" alt="${i.name}"></div>`
        : `<div class="avatar" style="background:${i.avatarColor};">${i.avatarInitial}</div>`;
      return `
        <div class="testimonial">
          <div class="stars">${i.stars}</div>
          <p>"${i.text}"</p>
          <div class="author-row">
            ${avatar}
            <div class="author-info">
              <div class="author-name">${i.name}</div>
              <div class="author">${i.role}</div>
            </div>
          </div>
        </div>`;
    }
    return `
      <span class="eyebrow">${t.eyebrow}</span>
      <h2>${t.headingHtml}</h2>
      <p class="section-sub">${t.subHtml}</p>
      <div class="testimonials-grid">${t.items.map(item).join('')}</div>
      <h3 style="margin-top:28px; font-size:17px;">${t.galleryHeading}</h3>
      <div class="hscroll-gallery social-proof auto-scroll">
        ${t.gallery.map(img => `<img src="${img.src}" alt="${img.alt}">`).join('')}
      </div>
    `;
  }

  function bonusesHtml(b){
    function item(i){
      return `
        <div class="bonus-card">
          <span class="bonus-tag">${i.tag}</span>
          <h3>${i.title}</h3>
          <p>${i.desc}</p>
          <span class="old-price">${i.oldPrice}</span>
        </div>`;
    }
    const eq = b.equation;
    return `
      <span class="eyebrow">${b.eyebrow}</span>
      <h2>${b.heading}</h2>
      <p class="section-sub">${b.sub}</p>
      <div class="bonus-grid">${b.items.map(item).join('')}</div>
      <div class="equation-bar">
        <div class="eq-item">
          <span class="eq-label">${eq.bonusTotalLabel}</span>
          <span class="eq-value">${eq.bonusTotalValue}</span>
        </div>
        <span class="eq-op">+</span>
        <div class="eq-item">
          <span class="eq-label">${eq.plantsLabel}</span>
        </div>
        <span class="eq-op">=</span>
        <div class="eq-item eq-final">
          <span class="eq-label">${eq.finalLabel}</span>
          <span class="eq-value">${eq.finalValue}</span>
        </div>
      </div>
    `;
  }

  function pricingHtml(pr){
    function plan(p){
      const btnStyle = p.buttonStyle === 'muted' ? ' style="background:var(--bg-card-2); color:var(--text); box-shadow:none;"' : '';
      const btnId = p.triggersDownsell ? ` id="btn-${p.id}"` : '';
      return `
        <div class="plan${p.featured ? ' featured' : ''}" id="plan-${p.id}">
          ${p.badge ? `<span class="plan-badge">${p.badge}</span>` : ''}
          <h3>${p.name}</h3>
          <span class="anchor">${p.anchor}</span>
          <div class="price">${p.price}${p.priceNote ? ` <small>${p.priceNote}</small>` : ''}</div>
          <span class="savings">${p.savings}</span>
          <ul>${p.featuresHtml.map(f => `<li>${f}</li>`).join('')}</ul>
          <a href="${p.ctaHref}" class="cta-btn"${btnId}${btnStyle}>${p.ctaText}</a>
        </div>`;
    }
    return `
      <span class="eyebrow">${pr.eyebrow}</span>
      <h2>${pr.heading}</h2>
      <div class="plans">${pr.plans.map(plan).join('')}</div>
      <div class="trust-badges">${pr.trustBadges.map(tb => `<span>${tb}</span>`).join('')}</div>
    `;
  }

  function guaranteeHtml(g){
    return `
      <div class="guarantee">
        <div class="seal">${g.seal}</div>
        <h2>${g.heading}</h2>
        <p>${g.text}</p>
      </div>
    `;
  }

  function faqHtml(f){
    function item(i){
      return `
        <div class="faq-item">
          <div class="faq-q">${i.q} <span class="arrow">+</span></div>
          <div class="faq-a">${i.a}</div>
        </div>`;
    }
    return `
      <h2>${f.heading}</h2>
      <div class="faq">${f.items.map(item).join('')}</div>
    `;
  }

  function finalCtaHtml(fc){
    return `
      <div class="final-cta">
        <h2>${fc.heading}</h2>
        <p>${fc.text}</p>
        <a href="${fc.ctaHref}" class="cta-btn">${fc.ctaText}</a>
      </div>
    `;
  }

  function downsellPopupHtml(dp){
    return `
      <h3>${dp.title}</h3>
      <p>${dp.textHtml}</p>
      <a href="${dp.ctaHref}" class="cta-btn">${dp.ctaText}</a>
      <span class="close-popup" id="close-popup">${dp.closeText}</span>
    `;
  }

  // ---------- RENDER + COMPORTAMENTO ----------

  function renderPage(c){
    document.title = c.meta.title;
    document.getElementById('ticker-track').innerHTML = tickerHtml(c.ticker);
    document.getElementById('section-hero').innerHTML = heroHtml(c.hero);
    document.getElementById('section-showcase').innerHTML = showcaseHtml(c.showcase);
    document.getElementById('section-pain').innerHTML = painHtml(c.pain);
    document.getElementById('section-what-you-get').innerHTML = whatYouGetHtml(c.whatYouGet);
    document.getElementById('section-acervo-rural').innerHTML = acervoRuralHtml(c.acervoRural);
    document.getElementById('section-testimonials').innerHTML = testimonialsHtml(c.testimonials);
    document.getElementById('section-bonuses').innerHTML = bonusesHtml(c.bonuses);
    document.getElementById('section-rural-packs').innerHTML = ruralPacksHtml(c.ruralPacks);
    document.getElementById('pricing').innerHTML = pricingHtml(c.pricing);
    document.getElementById('section-guarantee').innerHTML = guaranteeHtml(c.guarantee);
    document.getElementById('section-faq').innerHTML = faqHtml(c.faq);
    document.getElementById('section-final-cta').innerHTML = finalCtaHtml(c.finalCta);
    document.getElementById('section-footer').innerHTML = c.footerHtml;
    document.getElementById('downsell-popup').innerHTML = downsellPopupHtml(c.downsellPopup);

    initBehavior(c);
  }

  function initBehavior(c){
    // Timer regressivo (atualiza todos os relogios do ticker)
    (function(){
      var duration = c.timerSeconds;
      var els = document.querySelectorAll('.timer-el');
      var timer = setInterval(function(){
        var m = Math.floor(duration/60), s = duration%60;
        var txt = (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
        els.forEach(function(el){ el.textContent = txt; });
        if(--duration < 0){ clearInterval(timer); els.forEach(function(el){ el.textContent = '00:00'; }); }
      }, 1000);
    })();

    // Rolagem automatica das galerias (resultados, provas sociais, acervo)
    document.querySelectorAll('.auto-scroll').forEach(function(gallery){
      gallery.innerHTML += gallery.innerHTML;

      var paused = false;
      var resumeTimeout;
      var halfWidth = 0;
      function calcHalfWidth(){ halfWidth = gallery.scrollWidth / 2; }
      window.addEventListener('load', calcHalfWidth);
      setTimeout(calcHalfWidth, 300);

      function tick(){
        if(!paused && halfWidth > 0){
          gallery.scrollLeft += 1.4;
          if(gallery.scrollLeft >= halfWidth){
            gallery.scrollLeft -= halfWidth;
          }
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      function pauseAutoScroll(){
        paused = true;
        clearTimeout(resumeTimeout);
        resumeTimeout = setTimeout(function(){ paused = false; }, 2500);
      }
      gallery.addEventListener('touchstart', pauseAutoScroll, {passive:true});
      gallery.addEventListener('mousedown', pauseAutoScroll);
      gallery.addEventListener('wheel', pauseAutoScroll, {passive:true});
    });

    // FAQ accordion
    document.querySelectorAll('.faq-item').forEach(function(item){
      item.querySelector('.faq-q').addEventListener('click', function(){
        var wasOpen = item.classList.contains('open');
        document.querySelectorAll('.faq-item').forEach(function(i){ i.classList.remove('open'); });
        if(!wasOpen) item.classList.add('open');
      });
    });

    // Pixel: ViewContent ao ver a secao de pricing
    if(typeof fbq !== 'undefined'){
      var pricingSeen = false;
      var pricingSection = document.getElementById('pricing');
      if(pricingSection){
        var obs = new IntersectionObserver(function(entries){
          entries.forEach(function(entry){
            if(entry.isIntersecting && !pricingSeen){
              pricingSeen = true;
              fbq('track', 'ViewContent');
            }
          });
        }, {threshold:0.4});
        obs.observe(pricingSection);
      }

      // Pixel: InitiateCheckout ao clicar em qualquer CTA de checkout
      document.querySelectorAll('a[href*="pay.wiapy.com"]').forEach(function(btn){
        btn.addEventListener('click', function(){
          fbq('track', 'InitiateCheckout');
        });
      });
    }

    // Popup downsell no clique do plano basico
    var btnBasico = document.getElementById('btn-basico');
    if(btnBasico){
      btnBasico.addEventListener('click', function(e){
        e.preventDefault();
        document.getElementById('downsell-overlay').classList.add('active');
      });
    }
    var closePopup = document.getElementById('close-popup');
    if(closePopup){
      var basicoPlan = c.pricing.plans.find(function(p){ return p.id === 'basico'; });
      closePopup.addEventListener('click', function(){
        window.location.href = basicoPlan.ctaHref;
      });
    }
  }

  fetch('content.json')
    .then(function(res){ return res.json(); })
    .then(renderPage)
    .catch(function(err){ console.error('Falha ao carregar content.json:', err); });
</script>
